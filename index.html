function decodePage(encoded) {
  return new TextDecoder('utf-8').decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0)));
}
document.getElementById('frame-mlb').srcdoc = decodePage(pages.mlb);
document.getElementById('frame-nfl').srcdoc = decodePage(pages.nfl);
function showSport(sport) {
  for (const name of ['mlb', 'nfl']) {
    const selected = name === sport;
    document.getElementById('tab-' + name).setAttribute('aria-selected', String(selected));
    document.getElementById('panel-' + name).hidden = !selected;
  }
}
