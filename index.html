function decodePage(encoded) { return new TextDecoder('utf-8').decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0))); }
for (const sport of ['mlb','nfl','nhl']) document.getElementById('frame-' + sport).srcdoc = decodePage(pages[sport]);
function showSport(sport) {
  for (const name of ['mlb','nfl','nhl']) {
    const selected = name === sport;
    document.getElementById('tab-' + name).setAttribute('aria-selected', String(selected));
    document.getElementById('panel-' + name).hidden = !selected;
  }
}
