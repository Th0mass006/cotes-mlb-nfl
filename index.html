* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body { display: flex; flex-direction: column; height: 100vh; background: var(--bg); color: var(--text); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.app-header { display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; padding:18px clamp(18px,3vw,42px); border-bottom:1px solid var(--line); background:linear-gradient(100deg,#142438,#0e1b2b 70%,#132338); }
.brand-lockup { display:flex; align-items:center; gap:13px; }
.brand-mark { display:flex; flex-direction:column; align-items:center; justify-content:center; width:42px; height:42px; border-radius:12px; color:#073c33; background:linear-gradient(145deg,#a0f3db,#67d7c3); box-shadow:0 0 0 5px rgba(105,230,197,.08); }
.brand-mark svg { width:22px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.brand-mark span { margin-top:-1px; color:#073c33; font-size:16px; font-weight:900; letter-spacing:-.08em; line-height:17px; }
.brand-title { font-size:20px; font-weight:850; letter-spacing:-.04em; line-height:1.05; }
.brand-title span { color:var(--accent); }
.brand-subtitle { margin-top:4px; color:var(--muted); font-size:10px; font-weight:750; letter-spacing:.16em; }

.status { display:inline-flex; align-items:center; gap:7px; padding:7px 10px; border:1px solid #2c4d4d; border-radius:20px; background:#143333; color:#a2efda; }

.nav-label { flex:0 0 auto; color:#8097ab; font-size:10px; font-weight:850; letter-spacing:.17em; }
.sport-switch { display:flex; flex:1; gap:9px; }
.sports-tab { display:flex; align-items:center; gap:11px; min-width:0; flex:0 1 242px; padding:11px 13px; border:1px solid #2c4155; border-radius:11px; background:linear-gradient(140deg,#142438,#112034); color:#bed0df; text-align:left; cursor:pointer; transition:transform .18s,border-color .18s,background .18s,box-shadow .18s; }
.sports-tab:hover { transform:translateY(-2px); border-color:#567987; background:#1b3144; }
.sports-tab[aria-selected="true"] { border-color:var(--accent); background:linear-gradient(130deg,#1c3b43,#15303d); color:#fff; box-shadow:inset 3px 0 0 var(--accent),0 8px 22px rgba(0,0,0,.12); }
.sport-icon { display:grid; place-items:center; flex:0 0 auto; width:34px; height:34px; border:1px solid #3c5667; border-radius:9px; background:#223547; font-size:17px; }
.sports-tab[aria-selected="true"] .sport-icon { border-color:#548e88; background:#275353; }
.sport-copy { display:flex; flex-direction:column; min-width:0; gap:2px; }
.sport-copy strong { font-size:13px; font-weight:800; letter-spacing:.01em; }
.sport-copy small { overflow:hidden; color:#90a8ba; font-size:10px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
.sports-tab[aria-selected="true"] .sport-copy small { color:#b6d9d3; }
.workspace { flex:1 1 auto; min-height:0; }
.sports-panel { height:100%; }
.sports-panel[hidden] { display:none; }
iframe { display:block; width:100%; height:100%; border:0; background:var(--bg); }

.sports-tab:hover { transform:none; }

function decodePage(encoded) { return new TextDecoder('utf-8').decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0))); }
for (const sport of ['mlb','nfl','nhl']) document.getElementById('frame-' + sport).srcdoc = decodePage(pages[sport]);
function showSport(sport) {
  for (const name of ['mlb','nfl','nhl']) {
    const selected = name === sport;
    document.getElementById('tab-' + name).setAttribute('aria-selected', String(selected));
    document.getElementById('panel-' + name).hidden = !selected;
  }
}
